name: webOS port smoke build
on:
  push:
    branches: [webos-2020-plus]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [lite, full]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'
      - run: bun install --frozen-lockfile
      - run: bun run build.ts --version 0.1.0-dev --target webos --variant ${{ matrix.variant }}
      - name: Check output exists
        run: |
          find dist -type f -name '*webos*.user.js' -size +0c | grep .
      - uses: actions/upload-artifact@v6
        with:
          name: webos-${{ matrix.variant }}-experimental-js
          path: dist/*webos*.user.js
          if-no-files-found: error
          retention-days: 7
